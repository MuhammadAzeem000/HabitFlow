# Launcher icons. Regenerate after replacing assets/brand/*.png:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/icon.png"
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_background: "#2E7D6B"
  adaptive_icon_foreground: "assets/brand/icon_foreground.png"
  adaptive_icon_monochrome: "assets/brand/icon_foreground.png"
